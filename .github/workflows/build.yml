name: Build Lia Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Build Standard & Direct Debug APKs
        run: |
          ./gradlew assembleStandardDebug assembleDirectDebug --stacktrace

      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: Lia-Standard-Debug-APK
          path: app/build/outputs/apk/standard/debug/*.apk

      - name: Upload Direct APK (With Visual Agent & Licensing)
        uses: actions/upload-artifact@v4
        with:
          name: Lia-Direct-Debug-APK
          path: app/build/outputs/apk/direct/debug/*.apk
